name: runtime

# Builds the Flowly runtime (scripts/build_runtime.py) on every platform
# Desktop and the cloud computer run: a portable Python with Core and its
# locked dependencies, one archive per target. Each target builds on its own
# runner because the dependencies are native wheels.
#
# A tag vX.Y.Z publishes the archives and their .sha256 files to that tag's
# GitHub release, where Desktop's build and the cloud image fetch them.
# Any other run (a PR touching the builder, a manual run) only keeps them as
# workflow artifacts.
#
# A tag also builds the cloud computer's image from the same source
# (cloud/image/build-context.sh --ref) and pushes it to Fly's registry as
# registry.fly.io/flowly-bots-image:<version>. The Flowly server watches this
# repository's latest release and moves every cloud computer to that image on
# its own; until
# the image exists it waits, so the release does not wait for the image.
#
# The image job runs in the `cloud-image` environment: FLY_IMAGE_TOKEN (a
# deploy token of that one app: `fly tokens create deploy -a
# flowly-bots-image`) lives only there, the environment admits only v* tags,
# and a maintainer approves each run before the token is handed out. Nothing
# else in this public repository can read it. Without the secret the step is
# skipped and every machine stays where it is.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/build_runtime.py"
      - "flowly/runtime_bundle.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"

      - name: Static OpenSSL for cryptography (Intel macOS)
        if: matrix.target == 'darwin-x64'
        shell: bash
        run: |
          # cryptography ships no Intel macOS wheel, so it builds from source.
          # Link OpenSSL statically: the runtime must not depend on Homebrew.
          prefix="$(brew --prefix openssl@3)"
          test -f "$prefix/lib/libssl.a" && test -f "$prefix/lib/libcrypto.a"
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: uv run --no-project --python 3.12 python scripts/build_runtime.py --ref "$GITHUB_SHA" --out dist/runtime

      - name: Check the target
        shell: bash
        run: |
          built="$(uv run --no-project --python 3.12 python -c "import json; print(json.load(open('dist/runtime/flowly-runtime/flowly-runtime.json'))['target'])")"
          test "$built" = "${{ matrix.target }}" || { echo "built $built, expected ${{ matrix.target }}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: flowly-runtime-${{ matrix.target }}
          path: |
            dist/runtime/flowly-runtime-*.tar.gz
            dist/runtime/flowly-runtime-*.zip
            dist/runtime/flowly-runtime-*.sha256
          if-no-files-found: error

  cloud-image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: cloud-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: 0.4.120

      - name: Build and push the cloud image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IMAGE_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_IMAGE_TOKEN is not set; no cloud image for $GITHUB_REF_NAME"
            exit 0
          fi
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ctx="$RUNNER_TEMP/cloud-image"
          cloud/image/build-context.sh "$ctx" --ref "$GITHUB_REF_NAME"
          sed -e 's/^app = .*/app = "flowly-bots-image"/' cloud/image/fly.toml.example > "$ctx/fly.toml"
          cd "$ctx"
          flyctl deploy --build-only --push --remote-only --image-label "$version"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag names the version in pyproject.toml
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: flowly-runtime-*
          merge-multiple: true

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Flowly Core $GITHUB_REF_NAME" \
                 $(case "$GITHUB_REF_NAME" in *[!v0-9.]*) echo --prerelease ;; esac)
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
